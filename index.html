<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Diario Fútbol en Español</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#0e211b; color:#f2f2f2; margin:0; padding:2rem 1rem; }
  .wrap { max-width: 640px; margin: 0 auto; }
  img.cover { width: 200px; border-radius: 16px; display:block; margin: 0 auto 1.5rem; }
  h1 { text-align:center; font-size: 1.6rem; }
  p.sub { text-align:center; color:#9fc2b4; }
  .feed-box { background:#173029; border-radius: 12px; padding: 1rem 1.2rem; margin: 1.5rem 0; word-break: break-all; font-size: 0.9rem; }
  a { color: #8fd6b8; }
  audio { width: 100%; margin-top: 0.5rem; }
  .episode { border-top: 1px solid #234139; padding: 1rem 0; }
</style>
</head>
<body>
<div class="wrap">
  <img class="cover" src="cover.png" alt="Cover">
  <h1>Diario Fútbol en Español</h1>
  <p class="sub">Tägliches kurzes Update zu La Liga, auf Spanisch.</p>
  <div class="feed-box">
    Podcast-Feed zum Abonnieren:<br>
    <a href="feed.xml">feed.xml</a>
  </div>
  <div id="episodes"></div>
</div>
<script>
fetch('episodes.json').then(r => r.json()).then(episodes => {
  const container = document.getElementById('episodes');
  episodes.forEach(ep => {
    const div = document.createElement('div');
    div.className = 'episode';
    div.innerHTML = `<strong>${ep.date}</strong> — ${ep.title}<br>
      <audio controls src="episodes/${ep.filename}"></audio>`;
    container.appendChild(div);
  });
}).catch(() => {});
</script>
</body>
</html>
